name: build and deploy

# main builds and deploys. pnpm test:solar runs first, because every other
# number in this project depends on it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, and on its own: the solar engine against published values.
      - run: pnpm test:solar

      - run: pnpm test:run
      - run: pnpm typecheck
      - run: pnpm lint

      - name: build
        run: pnpm build
        env:
          # basePath must match the repository name.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: check .nojekyll exists
        run: test -f out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
